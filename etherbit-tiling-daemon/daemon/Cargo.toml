[package]
name = "etherbit-tiling-daemon"
version = "0.1.0"
edition = "2021"

[features]
# UI própria do daemon via wgpu (HUD de preview no KDE + futuro painel de config), com fallback por
# software. Desligada por padrão: mantém o daemon leve e o CI sem necessidade de GPU. Ver src/render.rs.
# Sob KWin (que suporta wlr-layer-shell) o daemon cria SUAS PRÓPRIAS superfícies de overlay e desenha
# o HUD com wgpu — sem violar o ADR 0016 (não há overlay sobre janelas alheias; é surface própria).
wgpu-ui = [
    "dep:wgpu",
    "dep:smithay-client-toolkit",
    "dep:raw-window-handle",
    "dep:bytemuck",
    "dep:wayland-client",
]

[dependencies]
etherbit-tiling-core = { path = "../../core" }
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
wgpu = { version = "22", optional = true }
# Cliente Wayland para criar a superfície de overlay (wlr-layer-shell) e ler o ponteiro (seat).
# `default-features = false`: dispensa a feature `xkbcommon` (só usamos ponteiro, não teclado),
# evitando a dependência da lib de sistema `libxkbcommon` no build.
smithay-client-toolkit = { version = "0.19", optional = true, default-features = false, features = [
    "calloop",
] }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# Habilita o backend de SISTEMA (FFI libwayland) do wayland-backend — feature unificada com o SCTK.
# `system`: dá `ObjectId::as_ptr`/`Backend::display_ptr` (ponteiros crus que o wgpu precisa para a
# `wgpu::Surface`). `dlopen`: carrega a libwayland em RUNTIME (via libloading) em vez de linkar em
# build — assim o CI/devcontainer compila SEM a `libwayland-client` de sistema, e no KDE (que sempre a
# tem) o overlay funciona. Não é usado diretamente no código; entra só pela unificação de features.
wayland-client = { version = "0.31", optional = true, features = ["system", "dlopen"] }
