[package]
name = "etherbit-tiling-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
etherbit-tiling-core = { path = "../../core" }
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
