name: release

# Dispara SOMENTE em mudanças de código. Como o GitHub não permite combinar
# `paths` com `paths-ignore` no mesmo evento, listamos apenas as pastas de
# lógica — assim commits que tocam só `web/`, `docs/` ou `*.md` nunca acionam
# um release (mudanças na landing/documentação não afetam o motor do app).
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'platform-linux-gnome/**'
      - 'platform-linux-kde/**'
      # - 'platform-macos/**'   # futuro (ver job comentado abaixo)
  # Permite disparar o release manualmente pela aba Actions (Run workflow),
  # ignorando o filtro de `paths` acima. Útil para reprocessar uma release.
  workflow_dispatch:

# Arquitetura de DOIS repositórios:
#   - Repo PRIVADO (este): o semantic-release calcula a versão a partir dos
#     Conventional Commits, cria a TAG git aqui (estado de versão para a próxima
#     execução — invisível ao público) e roda o build. NÃO publica Release
#     pública aqui (o plugin @semantic-release/github foi removido do
#     .releaserc.json), por isso o build acontece de forma silenciosa.
#   - Repo PÚBLICO (ediano/etherbit-tiling-releases): recebe a Release, a tag
#     calculada e os assets via softprops/action-gh-release, autenticado com o
#     PAT RELEASE_REPO_TOKEN. É a face pública/anônima da distribuição.
#
# `contents: write` é necessário para o semantic-release empurrar a tag git
# para ESTE repositório privado (a publicação no repo externo usa o PAT, não o
# GITHUB_TOKEN, então não depende destas permissões).
permissions:
  contents: write

# Evita dois releases concorrentes na mesma branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate de qualidade: roda a suíte isolada por plataforma (.github/workflows/test.yml,
  # reutilizável via workflow_call). O release só começa se TODOS os testes passarem.
  tests:
    name: Testes (gate do release)
    uses: ./.github/workflows/test.yml

  release-linux:
    name: Release (Linux / GNOME + KDE)
    needs: tests
    runs-on: ubuntu-latest
    # O secret RELEASE_REPO_TOKEN está vinculado ao Environment "github-token";
    # secrets de Environment só ficam disponíveis quando o job o declara aqui.
    environment: github-token
    steps:
      - name: Checkout (histórico completo p/ análise de commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de build do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform-linux-gnome

      - name: Node + corepack (pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Habilita pnpm via corepack
        run: corepack enable

      - name: Dependências de build do daemon
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config build-essential

      # semantic-release (repo PRIVADO): calcula a próxima versão a partir dos
      # Conventional Commits (fix: -> patch, feat: -> minor), roda o build via
      # prepareCmd (build-gnome-release.sh + build-kde-release.sh) gerando
      # `etherbit-tiling-gnome.tar.gz` e `etherbit-tiling-kde.tar.gz`, e
      # cria/empurra a TAG git neste repo —
      # preservando o estado de versão. O publishCmd exporta a versão calculada
      # como output (`steps.semrel.outputs.version`); se nenhum release for
      # devido, o output fica vazio e a publicação pública é pulada.
      - name: semantic-release (calcula versão + build + tag privada)
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/exec \
            -p conventional-changelog-conventionalcommits \
            semantic-release

      # Publicação PÚBLICA: cria a Release e a tag calculada no repositório
      # externo `ediano/etherbit-tiling-releases`, anexando os tar.gz unificados e
      # os install-*.sh individuais. Usa o PAT RELEASE_REPO_TOKEN (escrita no repo de
      # destino) em vez do GITHUB_TOKEN padrão. Só roda quando o semantic-release
      # de fato produziu uma nova versão.
      - name: Publica Release no repo público de releases
        if: steps.semrel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: ediano/etherbit-tiling-releases
          tag_name: v${{ steps.semrel.outputs.version }}
          name: Etherbit Tiling v${{ steps.semrel.outputs.version }}
          make_latest: true
          body: |
            ## Etherbit Tiling v${{ steps.semrel.outputs.version }} — Linux (GNOME + KDE)

            Artefatos de produção (sem código-fonte): daemon em Rust + camada nativa por ambiente.
            O daemon é compartilhado entre GNOME e KDE.

            ### GNOME (Wayland)
            **Instalação (um comando)**
            ```
            curl -sSL https://github.com/ediano/etherbit-tiling-releases/releases/latest/download/install-gnome.sh | bash
            ```
            **Manual:** baixe `etherbit-tiling-gnome.tar.gz`, extraia e rode `./install-gnome.sh`.
            **Desinstalação:**
            ```
            curl -sSL https://github.com/ediano/etherbit-tiling-releases/releases/latest/download/uninstall-gnome.sh | bash
            ```

            ### KDE Plasma 6 (Wayland)
            **Instalação (um comando)**
            ```
            curl -sSL https://github.com/ediano/etherbit-tiling-releases/releases/latest/download/install-kde.sh | bash
            ```
            **Manual:** baixe `etherbit-tiling-kde.tar.gz`, extraia e rode `./install-kde.sh`.
            **Desinstalação:**
            ```
            curl -sSL https://github.com/ediano/etherbit-tiling-releases/releases/latest/download/uninstall-kde.sh | bash
            ```
          files: |
            etherbit-tiling-gnome.tar.gz
            etherbit-tiling-kde.tar.gz
            packaging/install-gnome.sh
            packaging/uninstall-gnome.sh
            packaging/install-kde.sh
            packaging/uninstall-kde.sh

  # -----------------------------------------------------------------------------
