name: release

# Dispara SOMENTE em mudanças de código. Como o GitHub não permite combinar
# `paths` com `paths-ignore` no mesmo evento, listamos apenas as pastas de
# lógica — assim commits que tocam só `web/`, `docs/` ou `*.md` nunca acionam
# um release (mudanças na landing/documentação não afetam o motor do app).
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'etherbit-tiling-daemon/**'
      - 'platform-linux-gnome/**'
      - 'platform-linux-kde/**'
      # - 'platform-macos/**'   # futuro (ver job comentado abaixo)
  # Permite disparar o release manualmente pela aba Actions (Run workflow),
  # ignorando o filtro de `paths` acima. Útil para reprocessar uma release.
  workflow_dispatch:

# Repositório ÚNICO e público (ADR 0069 — o antigo `ediano/etherbit-tiling-releases` foi
# descontinuado): o semantic-release calcula a versão a partir dos Conventional Commits, cria a TAG
# git e roda o build; a Release com os assets é publicada AQUI MESMO via softprops/action-gh-release,
# autenticada com o GITHUB_TOKEN do próprio workflow (sem PAT).
#
# `contents: write` é necessário para empurrar a tag e criar a Release neste repositório.
permissions:
  contents: write

# Evita dois releases concorrentes na mesma branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate de qualidade: roda a suíte isolada por plataforma (.github/workflows/test.yml,
  # reutilizável via workflow_call). O release só começa se TODOS os testes passarem.
  tests:
    name: Testes (gate do release)
    uses: ./.github/workflows/test.yml

  release-linux:
    name: Release (Linux / GNOME + KDE)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo p/ análise de commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de build do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etherbit-tiling-daemon

      - name: Node + corepack (pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Habilita pnpm via corepack
        run: corepack enable

      - name: Dependências de build do daemon
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config build-essential

      # semantic-release: calcula a próxima versão a partir dos
      # Conventional Commits (fix: -> patch, feat: -> minor), roda o build via
      # prepareCmd (build-gnome-release.sh + build-kde-release.sh) gerando
      # `etherbit-tiling-gnome.tar.gz` e `etherbit-tiling-kde.tar.gz`, e
      # cria/empurra a TAG git neste repo —
      # preservando o estado de versão. O publishCmd exporta a versão calculada
      # como output (`steps.semrel.outputs.version`); se nenhum release for
      # devido, o output fica vazio e a publicação pública é pulada.
      - name: semantic-release (calcula versão + build + tag privada)
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/exec \
            -p conventional-changelog-conventionalcommits \
            semantic-release

      # Publicação: cria a Release da tag calculada NESTE repositório, anexando os tar.gz unificados e
      # os install-*.sh individuais (a landing `web/` os consome via `releases/latest/download`). Só
      # roda quando o semantic-release de fato produziu uma nova versão.
      - name: Publica Release
        if: steps.semrel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.semrel.outputs.version }}
          name: Etherbit Tiling v${{ steps.semrel.outputs.version }}
          make_latest: true
          body: |
            ## Etherbit Tiling v${{ steps.semrel.outputs.version }} — Linux (GNOME + KDE)

            Artefatos de produção: daemon em Rust + camada nativa por ambiente.
            O daemon é compartilhado entre GNOME e KDE.

            > Baixe os artefatos **desta** release, nos **Assets** abaixo. Cada release contém a
            > sua própria versão — não dependa de _latest_.

            > **Atualizando de uma versão anterior?** Em saltos _major_, o identificador da
            > extensão/serviço pode mudar — rode o `uninstall-*.sh` da versão antiga (Assets da
            > release que você tem) **antes** de instalar a nova.

            ### GNOME (Wayland)
            1. Baixe `etherbit-tiling-gnome.tar.gz` nos Assets desta release.
            2. Extraia: `tar -xzf etherbit-tiling-gnome.tar.gz`
            3. Instale: `cd etherbit-tiling-gnome && ./install-gnome.sh`

            **Desinstalação:** baixe `uninstall-gnome.sh` nos Assets e rode `./uninstall-gnome.sh`.

            ### KDE Plasma 6 (Wayland)
            1. Baixe `etherbit-tiling-kde.tar.gz` nos Assets desta release.
            2. Extraia: `tar -xzf etherbit-tiling-kde.tar.gz`
            3. Instale: `cd etherbit-tiling-kde && ./install-kde.sh`

            **Desinstalação:** baixe `uninstall-kde.sh` nos Assets e rode `./uninstall-kde.sh`.
          files: |
            etherbit-tiling-gnome.tar.gz
            etherbit-tiling-kde.tar.gz
            packaging/install-gnome.sh
            packaging/uninstall-gnome.sh
            packaging/install-kde.sh
            packaging/uninstall-kde.sh

  # -----------------------------------------------------------------------------
